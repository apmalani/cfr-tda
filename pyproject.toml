[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfrtda"
version = "0.1.0"
description = "Training data attribution for CFR on Kuhn poker"
requires-python = ">=3.10"
dependencies = ["open_spiel>=1.5", "torch>=2.2", "numpy", "scipy"]

[tool.setuptools]
packages = ["cfrtda"]
